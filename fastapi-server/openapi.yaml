openapi: 3.0.3
info:
  description: |
    Given a flight-segment is a Flight number, Origin, Destination and Julian day of the year,
    And that payload consists of Passengers, Baggage and Cargo,
    When this service learns (aka creates/updates) flight-segments with actual values,
    Then this service can predict the payload of a flight-segment.

    It supports the following operations:
    * Browse all flight-segments (aka actual past Payloads)
    * Create a flight-segment with an actual payload.
    * Update a flight-segment with another actual payload.
    * Get a Payload Prediction
    * Delete a Flight-Segment

    Forthcoming Features:
    * Result pagination
    * Security (Auth'n / Auth'z)
    * Timestamps for create, update, estimate
    * Payload Predictions constrained by the aircraft's MTOW and MLW.
    * Missing flight-segments (aka Payloads) are interpolated.

    We will use a simple **Payload** resource representation with the following properties:
    * ID
    * Flight
    * Origin
    * Destination
    * JulianDayOfYear
    * Passengers (count)
    * Baggage (weight)
    * Cargo (weight)
  title: Payload API
  version: v1.0.0
servers:
- description: Localhost environment
  url: http://localhost:8080/payload-api/v1.0.0
tags:
- description: Predicts Payloads for flight-segments.
  name: PayloadPredictor
paths:
  /payloads:
    get:
      description: Use this endpoint to browse all payloads in the estimator.
      operationId: getAllPayloads
      parameters:
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 5
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAllPayloads_200_response"
          description: Paginated array of payloads
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: UnauthorizedResponse. Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: You do not have enough rights to perform this operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Client error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: List all payloads
      tags:
      - Payloads
    post:
      description: Use this endpoint to add a new route to the estimator
      operationId: createPayload
      requestBody:
        $ref: "#/components/requestBodies/PayloadRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payload"
          description: Payload Details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: UnauthorizedResponse. Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: You do not have enough rights to perform this operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Client error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Create a new payload
      tags:
      - Payloads
  /payloads/{id}:
    delete:
      description: Use this endpoint to remove a payload from the estimator.
      operationId: deletePayload
      parameters:
      - example: 1001
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "204":
          description: Deleted successfully.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: UnauthorizedResponse. Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: You do not have enough rights to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Client error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Delete payload
      tags:
      - Payloads
    get:
      description: Use this endpoint to get the estimate for a specific route.
      operationId: getPayload
      parameters:
      - example: 1001
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payload"
          description: Payload Details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: UnauthorizedResponse. Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: You do not have enough rights to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Client error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Retrieve a payload by ID
      tags:
      - Payloads
    put:
      description: Use this endpoint to update the payload with actuals.
      operationId: updatePayload
      parameters:
      - example: 1001
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        $ref: "#/components/requestBodies/PayloadRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payload"
          description: Payload Details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: UnauthorizedResponse. Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: You do not have enough rights to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Client error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Update payload with actuals.
      tags:
      - Payloads
components:
  requestBodies:
    PayloadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Payload"
      description: Payload Details
  responses:
    PayloadResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Payload"
      description: Payload Details
    PayloadArrayResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/getAllPayloads_200_response"
      description: Paginated array of payloads
    ClientErrorResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Client error
    UnexpectedErrorResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Unexpected error
    NotFoundResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Resource not found
    UnauthorizedResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: UnauthorizedResponse. Authentication required
    ForbiddenResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: You do not have enough rights to perform this operation
  schemas:
    PaginatedResult:
      properties:
        offset:
          description: Page offset
          example: 10
          title: offset
          type: integer
        limit:
          description: Page size limit
          example: 5
          title: limit
          type: integer
        total:
          description: Total number of records across all pages
          example: 1500
          title: total
          type: integer
        data:
          items: {}
          title: data
          type: array
      title: PaginatedResult
      type: object
    Payload:
      example:
        passengers: 155
        baggage: 2510.5
        origin: MLB
        destination: MLB
        id: 1001
        cargo: 1220.2
        julianDoY: 123
      properties:
        id:
          description: Payload identifier
          example: 1001
          readOnly: false
          title: id
          type: integer
        origin:
          description: Origin airport IATA code.
          example: MLB
          readOnly: false
          title: origin
          type: string
        destination:
          description: Origin airport IATA code.
          example: MLB
          readOnly: false
          title: destination
          type: string
        julianDoY:
          description: The Julian Day of the Year (1-365/366).
          example: 123
          readOnly: false
          title: julianDoY
          type: integer
        passengers:
          description: Passenger count.
          example: 155
          title: passengers
          type: integer
        baggage:
          description: Weight of passengers baggage.
          example: 2510.5
          format: double
          title: baggage
          type: number
        cargo:
          description: Weight of cargo.
          example: 1220.2
          format: double
          title: cargo
          type: number
      title: Payload
      type: object
    PayloadArray:
      items:
        $ref: "#/components/schemas/Payload"
      type: array
    Error:
      example:
        message: Error details
      properties:
        message:
          example: Error details
          title: message
          type: string
      title: Error
      type: object
    getAllPayloads_200_response:
      allOf:
      - $ref: "#/components/schemas/PaginatedResult"
      - properties:
          data:
            $ref: "#/components/schemas/PayloadArray"
        type: object
      example:
        total: 1500
        offset: 10
        data:
        - passengers: 155
          baggage: 2510.5
          origin: MLB
          destination: MLB
          id: 1001
          cargo: 1220.2
          julianDoY: 123
        - passengers: 155
          baggage: 2510.5
          origin: MLB
          destination: MLB
          id: 1001
          cargo: 1220.2
          julianDoY: 123
        limit: 5
      title: getAllPayloads_200_response

version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: payload_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: payload_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: "postgresql+asyncpg://payload_user:secret@db:5432/payload_db"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # don't start the app by default when we just want the DB; use `docker-compose up app` explicitly

volumes:
  db_data:

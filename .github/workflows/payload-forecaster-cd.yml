name: Continusous Delivery

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag (defaults to github.sha)'
        required: true
      allow_unauthenticated:
        description: 'Allow unauthenticated (public) access to the service'
        required: false
        default: '--allow-unauthenticated'

jobs:
  deploy:
    name: Deploy image to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy pre-built image from Artifact Registry to Cloud Run
        env:
          # Artifact Registry docker repo path: <LOCATION>-docker.pkg.dev/<PROJECT>/<REPO>/<IMAGE>
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT }}
          REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
          IMAGE_NAME: payload-api
          TAG: ${{ github.event.inputs.image_tag || github.sha }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
        run: |
          # Compose the Artifact Registry image path. Example:
          # us-central1-docker.pkg.dev/my-project/payload-forecaster/payload-api:TAG
          ARTIFACT_IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${PROJECT}/${REPO}/${IMAGE_NAME}:${TAG}"
          echo "Deploying ${ARTIFACT_IMAGE} to Cloud Run service ${SERVICE} in region ${REGION}"
          gcloud run deploy "${SERVICE}" \
            --image "${ARTIFACT_IMAGE}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            # --platform managed \
            # --port 8080 \
            # =${{ github.event.inputs.allow_unauthenticated }} \
            # --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}"

      - name: Print service URL
        env:
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run services describe "${SERVICE}" --region "${REGION}" --format 'value(status.url)'
